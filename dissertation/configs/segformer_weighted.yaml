# configs/segformer.yaml — SegFormer training on IDD-AW

data_root: "dissertation/data/idd_aw"

image_root: "dissertation/data/idd_aw/IDDAW"
mask_root: "dissertation/data/processed/iddaw_masks"

num_classes: 42
ignore_index: 255

image_height: 512
image_width: 1024

model: "segformer"
backbone: "mit_b2"
pretrained: true
pretrained_checkpoint: "dissertation/pretrained/segformer-b2-cityscapes"

epochs: 40
batch_size: 2
val_batch_size: 2
num_workers: 4

optimizer: "adamw"
lr: 0.00005
weight_decay: 0.0001

amp: true
loss: "cross_entropy"
class_weights: true

output_dir: "dissertation/results/segformer_weighted"