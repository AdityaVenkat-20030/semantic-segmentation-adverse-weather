# configs/deeplabv3plus.yaml — DeepLabV3+ training on IDD-AW

# Dataset
image_root: "dissertation/data/idd_aw/IDDAW"
mask_root: "dissertation/data/processed/iddaw_masks"
num_classes: 42
ignore_index: 255
image_height: 512
image_width: 1024

# Model
model: "deeplabv3plus"
backbone: "resnet50"
pretrained: true
output_stride: 16

# Training
epochs: 40
batch_size: 2
val_batch_size: 2
num_workers: 4

# Optimizer
optimizer: "adamw"
lr: 0.00005
weight_decay: 0.0001

# AMP
amp: true

# Loss
loss: "cross_entropy"
class_weights: true

# Output
output_dir: "dissertation/results/deeplabv3plus_weighted"